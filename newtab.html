<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>新标签页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background Layer -->
  <div id="background-layer" class="background-layer">
    <div id="background-image" class="background-image"></div>
    <video id="background-video" class="background-video hidden" playsinline></video>
    <div id="background-overlay" class="background-overlay"></div>
  </div>

  <!-- Clock -->
  <div id="clock" class="clock" aria-label="当前时间"></div>

  <!-- Main Search Area -->
  <main class="main-content">
    <div id="search-container" class="search-container" role="search">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          id="search-input"
          class="search-input"
          type="text"
          name="q"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="搜索网页..."
          aria-label="搜索网页"
        >
        <button id="search-button" class="search-button" aria-label="执行搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- Suggestions Dropdown -->
      <div id="suggestions-dropdown" class="suggestions-dropdown" hidden>
        <ul id="suggestions-list" class="suggestions-list" role="listbox"></ul>
      </div>
    </div>
  </main>

  <!-- Bookmarks Bar -->
  <div id="bookmarks-bar" class="bookmarks-bar">
    <div class="bookmarks-container">
      <div id="bookmarks-list" class="bookmarks-list"></div>
    </div>
  </div>

  <!-- Settings Gear -->
  <button id="settings-toggle" class="settings-toggle" aria-label="打开设置" title="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- Settings Panel -->
  <aside id="settings-panel" class="settings-panel" aria-hidden="true" aria-label="设置面板">
    <div class="settings-header">
      <h2 class="settings-title">设置</h2>
      <button id="settings-close" class="settings-close" aria-label="关闭设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <div class="settings-tabs" role="tablist" aria-label="设置分类">
      <button class="settings-tab" role="tab" id="tab-bg" data-tab="bg" aria-selected="true" aria-controls="tab-panel-bg" type="button">背景</button>
      <button class="settings-tab" role="tab" id="tab-search" data-tab="search" aria-selected="false" aria-controls="tab-panel-search" tabindex="-1" type="button">搜索</button>
      <button class="settings-tab" role="tab" id="tab-display" data-tab="display" aria-selected="false" aria-controls="tab-panel-display" tabindex="-1" type="button">显示</button>
      <div class="settings-tab-indicator" aria-hidden="true"></div>
    </div>

    <div class="settings-body">
      <!-- Background Section -->
      <section class="settings-tab-panel" id="tab-panel-bg" role="tabpanel" aria-labelledby="tab-bg" data-tab-panel="bg">
        <h3 class="settings-section-title">背景</h3>

        <!-- Background source radio list -->
        <div class="setting-group">
          <label class="setting-label">背景来源</label>
          <div class="radio-list" role="radiogroup" aria-label="背景来源">
            <!-- 必应每日 -->
            <button class="radio-option" role="radio" data-bg-source="bing" type="button">
              <span class="radio-dot">
                <svg class="radio-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="radio-label">必应每日壁纸</span>
            </button>
            <!-- 自定义图片 -->
            <button class="radio-option" role="radio" data-bg-source="image" type="button">
              <span class="radio-dot">
                <svg class="radio-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="radio-label">自定义图片</span>
            </button>
            <!-- 纯色 -->
            <button class="radio-option" role="radio" data-bg-source="color" type="button">
              <span class="radio-dot">
                <svg class="radio-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="radio-label">纯色</span>
            </button>
            <!-- 视频壁纸 -->
            <button class="radio-option" role="radio" data-bg-source="video" type="button">
              <span class="radio-dot">
                <svg class="radio-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="radio-label">视频壁纸</span>
            </button>
          </div>
        </div>

        <!-- 必应每日壁纸 子面板 -->
        <div class="setting-group bg-sub-panel" data-panel="bing" id="bg-bing-panel" hidden>
          <button id="bg-bing-refresh" class="setting-btn-secondary setting-btn-bing" type="button">刷新壁纸</button>
          <div id="bg-bing-meta" class="setting-meta" aria-live="polite"></div>
        </div>

        <!-- 自定义图片 子面板 -->
        <div class="setting-group bg-sub-panel" data-panel="image" id="bg-image-panel" hidden>
          <div class="file-upload-wrapper">
            <input type="file" id="bg-file-input" class="file-input" accept="image/*">
            <label for="bg-file-input" class="file-upload-btn">选择图片</label>
            <span id="bg-file-name" class="file-name">未选择文件</span>
          </div>
          <label class="setting-label setting-label-sub" for="bg-url-input">或输入图片链接</label>
          <input type="url" id="bg-url-input" class="setting-input" placeholder="https://..." autocomplete="off">
          <button id="bg-url-apply" class="setting-btn-secondary">应用</button>
          <div id="bg-url-error" class="setting-meta setting-meta-error" role="alert" aria-live="polite" hidden></div>
        </div>

        <!-- 纯色 子面板 -->
        <div class="setting-group bg-sub-panel" data-panel="color" id="bg-color-panel" hidden>
          <div class="color-swatch-grid" id="bg-color-swatch-grid">
            <button class="color-swatch bg-color-swatch" data-color="#1a1d24" style="background:#1a1d24" aria-label="深灰蓝"></button>
            <button class="color-swatch bg-color-swatch" data-color="#0d1117" style="background:#0d1117" aria-label="GitHub 暗"></button>
            <button class="color-swatch bg-color-swatch" data-color="#1a2a3a" style="background:#1a2a3a" aria-label="钢蓝"></button>
            <button class="color-swatch bg-color-swatch" data-color="#0f1a2e" style="background:#0f1a2e" aria-label="深海蓝"></button>
            <button class="color-swatch bg-color-swatch" data-color="#1a3a3a" style="background:#1a3a3a" aria-label="深青绿"></button>
            <button class="color-swatch bg-color-swatch" data-color="#1a2a2e" style="background:#1a2a2e" aria-label="暗青"></button>
            <button class="color-swatch bg-color-swatch" data-color="#2e1a3a" style="background:#2e1a3a" aria-label="靛紫"></button>
            <button class="color-swatch bg-color-swatch" data-color="#1a1a3e" style="background:#1a1a3e" aria-label="午夜蓝"></button>
            <button class="color-swatch bg-color-swatch custom-swatch" data-color="custom" id="bg-custom-color-trigger" aria-label="自定义颜色">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
          <input type="color" id="bg-color-input" class="setting-color-hidden" value="#1a1d24">
          <span id="bg-color-hex" class="color-hex">#1A1D24</span>
        </div>

        <!-- 视频壁纸 子面板 -->
        <div class="setting-group bg-sub-panel" data-panel="video" id="bg-video-panel" hidden>
          <div class="file-upload-wrapper">
            <input type="file" id="bg-video-input" class="file-input" accept="video/*">
            <label for="bg-video-input" class="file-upload-btn">选择视频</label>
            <span id="bg-video-name" class="file-name">未选择文件</span>
          </div>
          <label class="setting-label setting-label-row" for="video-sound-toggle" style="margin-top:12px">
            <span>开启声音</span>
            <span class="switch" role="switch" aria-checked="false" tabindex="0" id="video-sound-toggle">
              <span class="switch-knob"></span>
            </span>
          </label>
          <div id="video-volume-wrapper" hidden>
            <label class="setting-label setting-label-sub" for="video-volume-slider">音量 <span id="volume-value-display">50%</span></label>
            <input type="range" id="video-volume-slider" class="setting-slider" min="0" max="100" value="50" step="1">
          </div>
          <label class="setting-label setting-label-row" for="video-loop-toggle" style="margin-top:12px">
            <span>循环播放</span>
            <span class="switch on" role="switch" aria-checked="true" tabindex="0" id="video-loop-toggle">
              <span class="switch-knob"></span>
            </span>
          </label>
          <div id="video-onended-wrapper" hidden>
            <label class="setting-label setting-label-sub" for="video-onended-select">播放完成后</label>
            <div class="custom-select-wrapper">
              <button class="custom-select-trigger" id="video-onended-trigger" type="button">
                <span id="video-onended-label">黑屏</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="custom-select-dropdown" id="video-onended-dropdown" hidden>
                <button class="custom-select-option" data-value="black">黑屏</button>
                <button class="custom-select-option" data-value="lastframe">展示最后一帧</button>
                <button class="custom-select-option" data-value="customimage">展示自定义图片背景</button>
                <button class="custom-select-option" data-value="bing">展示必应壁纸</button>
              </div>
            </div>
            <select id="video-onended-select" class="setting-select-hidden" hidden>
              <option value="black">黑屏</option>
              <option value="lastframe">展示最后一帧</option>
              <option value="customimage">展示自定义图片背景</option>
              <option value="bing">展示必应壁纸</option>
            </select>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label" for="bg-blur-slider">背景模糊 <span id="blur-value-display">0px</span></label>
          <input type="range" id="bg-blur-slider" class="setting-slider" min="0" max="50" value="0" step="1">
        </div>

        <div class="setting-group">
          <label class="setting-label" for="overlay-opacity-slider">蒙版不透明度 <span id="opacity-value-display">0%</span></label>
          <input type="range" id="overlay-opacity-slider" class="setting-slider" min="0" max="100" value="0" step="1">
        </div>

        <div class="setting-group">
          <label class="setting-label">蒙版颜色</label>
          <div class="color-swatch-grid" id="color-swatch-grid">
            <button class="color-swatch" data-color="#000000" style="background:#000000" aria-label="黑色"></button>
            <button class="color-swatch" data-color="#1a2a3a" style="background:#1a2a3a" aria-label="钢蓝"></button>
            <button class="color-swatch" data-color="#0f1a2e" style="background:#0f1a2e" aria-label="深海蓝"></button>
            <button class="color-swatch" data-color="#1a3a3a" style="background:#1a3a3a" aria-label="深青绿"></button>
            <button class="color-swatch" data-color="#2e1a3a" style="background:#2e1a3a" aria-label="靛紫"></button>
            <button class="color-swatch" data-color="#1a1a3e" style="background:#1a1a3e" aria-label="午夜蓝"></button>
            <button class="color-swatch" data-color="#1a2a2e" style="background:#1a2a2e" aria-label="暗青"></button>
            <button class="color-swatch" data-color="#2a3a4a" style="background:#2a3a4a" aria-label="铅灰蓝"></button>
            <button class="color-swatch custom-swatch" data-color="custom" id="custom-color-trigger" aria-label="自定义颜色">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
          <input type="color" id="overlay-color-input" class="setting-color-hidden" value="#000000">
          <span id="color-hex-display" class="color-hex">#000000</span>
        </div>
      </section>

      <!-- Search Section -->
      <section class="settings-tab-panel" id="tab-panel-search" role="tabpanel" aria-labelledby="tab-search" data-tab-panel="search" hidden>
        <h3 class="settings-section-title">搜索</h3>

        <div class="setting-group">
          <label class="setting-label" for="engine-select">默认搜索引擎</label>
          <div class="custom-select-wrapper" id="engine-select-wrapper">
            <button class="custom-select-trigger" id="engine-select-trigger" type="button">
              <span id="engine-select-label">Google</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="custom-select-dropdown" id="engine-select-dropdown" hidden>
              <button class="custom-select-option" data-value="google">Google</button>
              <button class="custom-select-option" data-value="bing">Bing</button>
              <button class="custom-select-option" data-value="sogou">搜狗</button>
              <button class="custom-select-option" data-value="baidu">百度</button>
            </div>
          </div>
          <select id="engine-select" class="setting-select-hidden" hidden>
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="sogou">搜狗</option>
            <option value="baidu">百度</option>
          </select>
        </div>
      </section>

      <!-- Display Section -->
      <section class="settings-tab-panel" id="tab-panel-display" role="tabpanel" aria-labelledby="tab-display" data-tab-panel="display" hidden>
        <h3 class="settings-section-title">显示</h3>

        <div class="setting-group">
          <label class="setting-label setting-label-row" for="show-seconds-toggle">
            <span>显示秒</span>
            <span class="switch" role="switch" aria-checked="true" tabindex="0" id="show-seconds-toggle">
              <span class="switch-knob"></span>
            </span>
          </label>
        </div>

        <div class="setting-group">
          <label class="setting-label setting-label-row" for="show-bookmarks-toggle">
            <span>常用网址 Dock 栏</span>
            <span class="switch" role="switch" aria-checked="true" tabindex="0" id="show-bookmarks-toggle">
              <span class="switch-knob"></span>
            </span>
          </label>
        </div>

        <div class="setting-group">
          <label class="setting-label setting-label-row" for="cursor-effect-toggle">
            <span>鼠标特效</span>
            <span class="switch" role="switch" aria-checked="false" tabindex="0" id="cursor-effect-toggle">
              <span class="switch-knob"></span>
            </span>
          </label>
        </div>

        <div class="setting-group" id="cursor-style-group" hidden>
          <label class="setting-label" for="cursor-style-select">特效样式</label>
          <div class="custom-select-wrapper" id="cursor-style-wrapper">
            <button class="custom-select-trigger" id="cursor-style-trigger" type="button">
              <span id="cursor-style-label">彩纸</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="custom-select-dropdown" id="cursor-style-dropdown" hidden>
              <button class="custom-select-option" data-value="confetti">彩纸</button>
              <button class="custom-select-option" data-value="rain">落雨</button>
              <button class="custom-select-option" data-value="bubble">气泡</button>
              <button class="custom-select-option" data-value="star">星光</button>
              <button class="custom-select-option" data-value="kivotos">基沃托斯</button>
            </div>
          </div>
          <select id="cursor-style-select" class="setting-select-hidden" hidden>
            <option value="confetti">彩纸</option>
            <option value="rain">落雨</option>
            <option value="bubble">气泡</option>
            <option value="star">星光</option>
            <option value="kivotos">基沃托斯</option>
          </select>
        </div>

        <div class="setting-group">
          <label class="setting-label" for="glass-radius-slider">组件圆角 <span id="radius-value-display">20px</span></label>
          <input type="range" id="glass-radius-slider" class="setting-slider" min="0" max="32" value="20" step="1">
        </div>

        <div class="setting-group">
          <label class="setting-label" for="glass-style-select">玻璃效果</label>
          <div class="custom-select-wrapper" id="glass-style-wrapper">
            <button class="custom-select-trigger" id="glass-style-trigger" type="button">
              <span id="glass-style-label">毛玻璃</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="custom-select-dropdown" id="glass-style-dropdown" hidden>
              <button class="custom-select-option" data-value="frosted">毛玻璃</button>
              <button class="custom-select-option" data-value="liquid">液态玻璃</button>
            </div>
          </div>
          <select id="glass-style-select" class="setting-select-hidden" hidden>
            <option value="frosted">毛玻璃</option>
            <option value="liquid">液态玻璃</option>
          </select>
        </div>
      </section>

      <!-- Reset -->
      <div class="settings-footer">
        <button id="settings-reset" class="setting-btn-reset">恢复默认设置</button>
      </div>
    </div>
  </aside>

  <!-- Settings Overlay -->
  <div id="settings-overlay" class="settings-overlay" hidden></div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="confirm-dialog" hidden>
    <div class="confirm-dialog-body">
      <p id="confirm-dialog-msg" class="confirm-dialog-msg"></p>
      <div class="confirm-dialog-actions">
        <button id="confirm-dialog-cancel" class="confirm-dialog-btn confirm-dialog-btn--ghost">取消</button>
        <button id="confirm-dialog-ok" class="confirm-dialog-btn confirm-dialog-btn--solid">确定</button>
      </div>
    </div>
