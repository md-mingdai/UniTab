<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a5a80"/>
      <stop offset="1" stop-color="#1e2230"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.16"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Outer border highlight -->
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="white" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Inner border -->
  <rect x="3" y="3" width="122" height="122" rx="25" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Top highlight (glass effect) -->
  <rect x="0" y="0" width="128" height="40" rx="28" fill="url(#highlight)"/>
  <!-- Letter -->
  <text x="64" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="300" fill="white" fill-opacity="0.92">U</text>
</svg>
